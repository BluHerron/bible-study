
name: Deploy Bible Study to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Extract website
        shell: bash
                run: |
          mkdir -p extracted site

          if [ -f "bible-study-github-pages.zip" ]; then
            zip_file="bible-study-github-pages.zip"
          elif [ -f "bible-study-local-ai-updated.zip" ]; then
            zip_file="bible-study-local-ai-updated.zip"
          else
            echo "ERROR: Website ZIP not found."
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using website archive: $zip_file"
          unzip -q "$zip_file" -d extracted

          echo "Searching for index.html..."

          index_file=$(find extracted -type f -name index.html -print -quit)

          if [ -z "$index_file" ]; then
            echo "ERROR: No index.html found in ZIP."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          website_dir=$(dirname "$index_file")
          cp -a "$website_dir"/. site/

          if [ ! -f site/index.html ]; then
            echo "ERROR: Website index.html missing."
            exit 1
          fi

          echo "Website files ready:"
          ls -la site/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
